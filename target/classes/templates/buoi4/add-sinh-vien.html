<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
</head>
<body>
<h1>Header</h1>
<!--C1: nhanh: dat ten name input trung ten trong entity tuy truong-->
<form method="POST" action="/sinh-vien/add">
    <label for="mssv">MSSV:</label>
    <input type="text" id="mssv" name="mssv"><br><br>
    <label for="name">Tên:</label>
    <input type="text" id="name" name="ten"><br><br>
    <label for="age">Tuổi:</label>
    <input type="number" id="age" name="tuoi"><br><br>
    <label for="address">Địa chỉ:</label>
    <input type="text" id="address" name="diaChi"><br><br>
    <label>Giới tính:</label>
    <input type="radio" id="male" name="gioiTinh" value="true" checked>
    <label for="male">Nam</label>
    <input type="radio" id="female" name="gioiTinh" value="false">
    <label for="female">Nữ</label><br><br>
    <button type="submit">Add</button>
</form>
<h1>Footer</h1>
</body>
</html>
